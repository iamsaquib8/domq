name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - name: Test (all features)
        run: cargo test --all-features
      - name: Test (default)
        run: cargo test
      - name: Test (no default features, json only)
        run: cargo test --no-default-features --features json
      - name: Test (derive)
        run: cargo test --features derive
      # The macro's compile-fail (trybuild) and no_std tests. They only check
      # errors the macro itself reports, whose text is the same on every
      # toolchain.
      - name: Test derive macro
        run: cargo test -p domq-derive
      - name: Test CLI
        run: cargo test -p domq-cli
      - name: Zero runtime dependencies (default features)
        run: |
          DEPS=$(cargo tree -p domq -e normal --prefix none | sort -u | wc -l)
          echo "crates in default graph: $DEPS (expect 1: this crate)"
          test "$DEPS" -eq 1

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The MSRV comes from the `toolchain` input, not the action's ref, so
      # Dependabot can't bump it (dependabot.yml also ignores this action).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Check library on MSRV (all lib features)
        run: cargo check --no-default-features --features json,serde,query,markdown,std,derive
      - name: Check CLI on MSRV
        run: cargo check -p domq-cli

  lint:
    name: rustfmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - name: Changelog fragments
        run: |
          python3 -m unittest discover -s scripts -p 'test_changelog.py'
          python3 scripts/changelog.py check

  no_std:
    name: no_std (thumbv7em)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi
      - uses: Swatinem/rust-cache@v2
      - name: Build for a bare-metal target (alloc only)
        run: cargo build --no-default-features --features json,query,markdown --target thumbv7em-none-eabi

  wasm:
    name: wasm + npm package (build, test, size gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: rustfmt + clippy (bindings)
        working-directory: wasm
        run: |
          cargo fmt --check
          # Library and tests separately: built together (--all-targets), the
          # test-only deps switch on wasm-bindgen's `std`, which clashes with the
          # library's own no_std panic handler. Both feature sets: the full
          # build (default `extract`) and the core one.
          for features in "" "--no-default-features"; do
            cargo clippy --target wasm32-unknown-unknown --release $features -- -D warnings
            cargo clippy --target wasm32-unknown-unknown --tests $features -- -D warnings
          done
      # One crate, two modules: the core (`--no-default-features`, the package
      # root) and the full build with extraction (`domq-wasm/extract`). The
      # feature set of each is fixed by wasm/Cargo.toml and npm/build.mjs, so
      # this builds exactly what goes to npm.
      - name: Build the npm package (core and extract)
        working-directory: wasm
        run: node npm/build.mjs
      - name: Test the bindings (wasm-bindgen-test, Node), both builds
        working-directory: wasm
        run: |
          wasm-pack test --node
          wasm-pack test --node -- --no-default-features
      - name: Smoke-test the packed npm package in Node
        working-directory: wasm
        run: sh npm/smoke-test.sh
      - name: Gzipped size gates (core < 60,000 bytes, extract < 80,000 bytes)
        working-directory: wasm
        run: |
          # Core (`domq-wasm`): parser, selectors, text/Markdown/JSON/HTML.
          # Measured 56,647 bytes (gzip -9). Extract (`domq-wasm/extract`): the
          # core plus mainContent, metadata, links, resources,
          # toMarkdownChunks, tables and toCsv. Measured 77,769 bytes, up from
          # ~40,800 (0.4) as extraction, bytes-in, encoding detection and the
          # script-data tokenizer states landed in the one module. #111 split
          # the module in two so that parsing alone is no longer 78 KB. The
          # extract budget stays at the temporary 80,000. Raise either on
          # purpose, never by accident.
          CORE=$(gzip -9 -c pkg/domq_wasm_bg.wasm | wc -c)
          EXTRACT=$(gzip -9 -c pkg/extract/domq_wasm_bg.wasm | wc -c)
          echo "gzipped wasm, core:    $CORE bytes (budget 60000)"
          echo "gzipped wasm, extract: $EXTRACT bytes (budget 80000)"
          test "$CORE" -lt 60000
          test "$EXTRACT" -lt 80000

  conformance:
    name: conformance (html5lib tests, Readability, AEB, WCXB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: conformance
      # ~230 MB at pinned commits; cached until a pin changes.
      - uses: actions/cache@v6
        with:
          path: |
            conformance/wpt
            conformance/readability
            conformance/aeb
            conformance/wcxb
          key: conformance-data-${{ hashFiles('conformance/*_COMMIT') }}
      - name: Fetch the test data (pinned commits; no-op when cached)
        run: sh conformance/fetch.sh
      - name: rustfmt + clippy + self-tests (harness)
        run: |
          cargo fmt --manifest-path conformance/Cargo.toml -- --check
          cargo clippy --manifest-path conformance/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path conformance/Cargo.toml
      # docs/conformance.md is generated: any change in the parser's results
      # must come with the regenerated report, so the diff shows it.
      - name: docs/conformance.md is up to date
        run: cargo run --release --manifest-path conformance/Cargo.toml -- --check docs/conformance.md
      - name: docs/reader-mode.md is up to date
        run: cargo run --release --manifest-path conformance/Cargo.toml --bin reader -- --check docs/reader-mode.md
      - name: docs/reader-quality.md is up to date (AEB, WCXB)
        run: cargo run --release --manifest-path conformance/Cargo.toml --bin quality -- --check docs/reader-quality.md

  book:
    name: guide (mdBook build + examples)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4
      # The book's Rust examples link against the library alone, built into
      # its own target dir so exactly one `domq` rlib is on the path.
      - name: Test the book's Rust examples
        run: |
          CARGO_TARGET_DIR=target/book cargo build --lib
          mdbook test book -L target/book/debug/deps
      - name: Build the book
        run: mdbook build book

  fuzz:
    name: fuzz (build + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build fuzz targets
        run: cargo fuzz build
      - name: Smoke run (parse, 30s)
        run: cargo fuzz run parse -- -max_total_time=30
      - name: Smoke run (select, 30s)
        run: cargo fuzz run select -- -max_total_time=30
      - name: Smoke run (markdown, 30s)
        run: cargo fuzz run markdown -- -max_total_time=30
